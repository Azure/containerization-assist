# Agent Evaluation pipeline (1ES)
trigger: none

pr: none

parameters:
  - name: fixtures
    type: string
    default: test/fixtures/legacy-java/spring-boot-rest-api,test/fixtures/legacy-java/spring-mvc-war,test/fixtures/legacy-java/ejb-ant-monolith,test/fixtures/legacy-java/wildfly-container-quickstart
  - name: models
    type: string
    default: azure:gpt-4o,azure:gpt-4.1,azure:gpt-5.4
  - name: reps
    type: string
    default: '3'
  - name: paths
    type: string
    default: bare,mcp,skills
  - name: timeoutInMinutes
    type: number
    default: 360
  - name: reportStorageAccount
    type: string
    default: 'caagentevalreports'

resources:
  repositories:
    - repository: 1esPipelines
      type: git
      name: 1ESPipelineTemplates/1ESPipelineTemplates
      ref: refs/tags/release

variables:
  - group: ca-agent-eval-foundry
  - name: azureServiceConnection
    value: ca-agent-eval-svc-conn
  - name: NODE_VERSION
    value: '22'

extends:
  template: v1/1ES.Unofficial.PipelineTemplate.yml@1esPipelines
  parameters:
    pool:
      name: staging-pool-amd64-mariner-2
      image: 1es-azlinux-3-amd64-custom-disk
      os: linux
      hostArchitecture: amd64
    sdl:
      sourceAnalysisPool:
        name: staging-pool-amd64-mariner-2
        image: azcu-agent-amd64-windows-22-img
        os: windows
        hostArchitecture: amd64

    stages:
      - stage: Evaluate
        displayName: Agent Evaluation
        jobs:
          - job: gradient
            displayName: Gradient sweep
            timeoutInMinutes: ${{ parameters.timeoutInMinutes }}
            templateContext:
              outputs:
                - output: pipelineArtifact
                  displayName: Publish report artifact
                  targetPath: $(Build.ArtifactStagingDirectory)
                  artifactName: gradient-report
                  condition: always()
            steps:
              - checkout: self
                fetchDepth: 0

              - task: UseNode@1
                displayName: Setup Node.js
                inputs:
                  version: $(NODE_VERSION)

              - script: |
                  set -euo pipefail
                  missing=()
                  [ -z "${AZURE_FOUNDRY_API_KEY:-}"  ] && missing+=(AZURE_FOUNDRY_API_KEY)
                  [ -z "${AZURE_FOUNDRY_ENDPOINT:-}" ] && missing+=(AZURE_FOUNDRY_ENDPOINT)
                  if [ ${#missing[@]} -gt 0 ]; then
                    echo "##vso[task.logissue type=error]Missing required variables: ${missing[*]} (add them to the 'ca-agent-eval-foundry' variable group)"
                    exit 1
                  fi
                displayName: Preflight - verify Foundry variables
                env:
                  AZURE_FOUNDRY_API_KEY: $(AZURE_FOUNDRY_API_KEY)
                  AZURE_FOUNDRY_ENDPOINT: $(AZURE_FOUNDRY_ENDPOINT)

              # Route this build's install through the CFS proxy (1ES agents
              # block npmjs). Lockfile 'resolved' URLs are rewritten, then
              # restored so the working tree stays pristine.
              - script: |
                  set -euo pipefail
                  backup="package-lock.json.bak"
                  cp package-lock.json "$backup"
                  trap 'mv -f "$backup" package-lock.json' EXIT
                  sed -i 's#https://registry\.npmjs\.org/#https://packagefeedproxy.microsoft.io/npm/#g' package-lock.json
                  NPM_CONFIG_REGISTRY=https://packagefeedproxy.microsoft.io/npm/ NPM_CONFIG_ALWAYS_AUTH=true npm ci
                displayName: Install dependencies via CFS proxy (1ES agents block public registry)

              - script: npm run build
                displayName: Build project

              - script: |
                  set -euo pipefail
                  if ! command -v az >/dev/null 2>&1; then
                    sudo tdnf install -y azure-cli
                  fi
                  az version
                displayName: Install Azure CLI

              - task: AzureCLI@2
                displayName: Run gradient sweep
                inputs:
                  azureSubscription: $(azureServiceConnection)
                  scriptType: bash
                  scriptLocation: inlineScript
                  inlineScript: |
                    set -euo pipefail
                    if ! kubectl version --client >/dev/null 2>&1; then
                      # Non-root agent cannot write to /usr/local/bin, so install
                      # kubectl/kubelogin into a user-writable dir and add to PATH.
                      mkdir -p "$HOME/.local/bin"
                      az aks install-cli \
                        --install-location "$HOME/.local/bin/kubectl" \
                        --kubelogin-install-location "$HOME/.local/bin/kubelogin"
                      export PATH="$HOME/.local/bin:$PATH"
                    fi

                    PATHS_ARG=()
                    if [ -n "${PATHS_INPUT:-}" ]; then PATHS_ARG=(--paths "$PATHS_INPUT"); fi

                    npm run eval -- gradient \
                      --fixtures "$FIXTURES" \
                      --models "$MODELS" \
                      --reps "$REPS" \
                      "${PATHS_ARG[@]}" \
                      --out "$(Build.ArtifactStagingDirectory)/gradient.json"
                env:
                  AZURE_FOUNDRY_API_KEY: $(AZURE_FOUNDRY_API_KEY)
                  AZURE_FOUNDRY_ENDPOINT: $(AZURE_FOUNDRY_ENDPOINT)
                  AGENT_EVAL_RESOURCE_GROUP: ca-agent-eval
                  AGENT_EVAL_CLUSTER: ca-agent-eval-aks
                  AGENT_EVAL_REGISTRY: caagentevalacr.azurecr.io
                  AGENT_EVAL_NAMESPACE: eval-ns
                  FIXTURES: ${{ parameters.fixtures }}
                  MODELS: ${{ parameters.models }}
                  REPS: ${{ parameters.reps }}
                  PATHS_INPUT: ${{ parameters.paths }}

              - task: AzureCLI@2
                displayName: Publish report to blob (SAS URL)
                condition: always()
                continueOnError: true
                inputs:
                  azureSubscription: $(azureServiceConnection)
                  scriptType: bash
                  scriptLocation: inlineScript
                  inlineScript: |
                    set -uo pipefail
                    if [ -z "${REPORT_STORAGE_ACCOUNT:-}" ]; then
                      echo "reportStorageAccount not set — skipping blob publish."
                      echo "(Report is still available as the 'gradient-report' pipeline artifact.)"
                      exit 0
                    fi
                    SRC="$(Build.ArtifactStagingDirectory)"
                    DEST="builds/$(Build.BuildId)"
                    CONTAINER="reports"
                    ACCT="$REPORT_STORAGE_ACCOUNT"
                    # Best-effort: publishing the report must never fail the run
                    # (the JSON/HTML is always kept as the 'gradient-report' artifact).
                    publish() {
                      set -e
                      # Org policy forbids shared-key and anonymous access, so we use
                      # the service connection's AAD identity throughout and hand out a
                      # signed, time-limited (user-delegation) SAS URL that renders in
                      # the browser — no account key, no public/anonymous access.
                      az storage container create \
                        --account-name "$ACCT" --auth-mode login \
                        --name "$CONTAINER" >/dev/null 2>&1 || true
                      local published=0
                      local sas_blob=""
                      # Upload with explicit content-types so the browser RENDERS
                      # the HTML heatmap (and shows JSON) instead of downloading.
                      if [ -f "$SRC/gradient.html" ]; then
                        az storage blob upload \
                          --account-name "$ACCT" --auth-mode login \
                          --container-name "$CONTAINER" --name "$DEST/gradient.html" \
                          --file "$SRC/gradient.html" --content-type "text/html" --overwrite true || return 1
                        published=1
                        sas_blob="$DEST/gradient.html"
                      fi
                      if [ -f "$SRC/gradient.json" ]; then
                        az storage blob upload \
                          --account-name "$ACCT" --auth-mode login \
                          --container-name "$CONTAINER" --name "$DEST/gradient.json" \
                          --file "$SRC/gradient.json" --content-type "application/json" --overwrite true || return 1
                        published=1
                        # Prefer the HTML report for the link; fall back to JSON.
                        [ -z "$sas_blob" ] && sas_blob="$DEST/gradient.json"
                      fi
                      if [ "$published" -eq 0 ]; then
                        echo "No gradient.{html,json} found in $SRC — nothing to publish."
                        return 0
                      fi
                      # User-delegation SAS (AAD-signed, no account key). Valid 30 days.
                      local expiry url summary
                      expiry=$(date -u -d "+30 days" "+%Y-%m-%dT%H:%MZ")
                      url=$(az storage blob generate-sas \
                        --account-name "$ACCT" --auth-mode login --as-user \
                        --container-name "$CONTAINER" --name "$sas_blob" \
                        --permissions r --expiry "$expiry" --full-uri -o tsv) || return 1
                      echo "Gradient report published (SAS valid until $expiry): $url"
                      echo "##vso[task.setvariable variable=reportUrl]$url"
                      # Render the link as a section on the run's Summary tab.
                      summary="$(mktemp --suffix=.md)"
                      {
                        echo "## Gradient eval report"
                        echo ""
                        echo "[View report (renders in browser)]($url)"
                        echo ""
                        echo "_SAS link valid until ${expiry}._"
                      } > "$summary"
                      echo "##vso[task.uploadsummary]$summary"
                    }
                    if ! publish; then
                      echo "##vso[task.logissue type=warning]Report publish failed (check storage RBAC / account name). Report is still available as the 'gradient-report' pipeline artifact."
                    fi
                    exit 0
                env:
                  REPORT_STORAGE_ACCOUNT: ${{ parameters.reportStorageAccount }}

              - task: AzureCLI@2
                displayName: Purge eval ACR
                condition: always()
                continueOnError: true
                inputs:
                  azureSubscription: $(azureServiceConnection)
                  scriptType: bash
                  scriptLocation: inlineScript
                  inlineScript: |
                    set -uo pipefail
                    ACR="${AGENT_EVAL_REGISTRY%%.*}"
                    # Cleanup is non-blocking: warn and continue on any failure so a
                    # purge hiccup never fails an otherwise-successful eval run.
                    repos=$(az acr repository list --name "$ACR" -o tsv) || {
                      echo "##vso[task.logissue type=warning]Could not list repositories in $ACR — skipping ACR purge."
                      exit 0
                    }
                    for repo in $repos; do
                      echo "deleting $ACR/$repo"
                      if ! az acr repository delete --name "$ACR" --repository "$repo" --yes; then
                        echo "##vso[task.logissue type=warning]Failed to delete $ACR/$repo — continuing (non-blocking cleanup)."
                      fi
                    done
                    exit 0
                env:
                  AGENT_EVAL_REGISTRY: caagentevalacr.azurecr.io
