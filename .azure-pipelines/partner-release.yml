# Partner Release pipeline
trigger: none
pr: none

resources:
  repositories:
    - repository: 1esPipelines
      type: git
      name: 1ESPipelineTemplates/1ESPipelineTemplates
      ref: refs/tags/release

variables:
  StorageAccountName: azuresdkpartnerdrops
  AzureServiceConnection: azuresdkpartnerdrops
  GitHubServiceConnection: github-containerization-assist
  PackageName: containerization-assist
  Language: js
  NodeVersion: "22.x"

extends:
  template: v1/1ES.Official.PipelineTemplate.yml@1esPipelines
  parameters:
    pool:
      name: production-pool-amd64-mariner-2
      image: 1es-azlinux-3-amd64-custom-disk
      os: linux
      hostArchitecture: amd64
    sdl:
      sourceAnalysisPool:
        name: production-pool-amd64-mariner-2
        image: azcu-agent-amd64-windows-22-img
        os: windows
        hostArchitecture: amd64

    stages:
      - stage: Build
        displayName: Build Partner Drop
        jobs:
          - job: Build
            displayName: Build Partner Drop
            templateContext:
              outputs:
                - output: pipelineArtifact
                  displayName: Publish build artifacts
                  targetPath: $(Build.ArtifactStagingDirectory)/build-output
                  artifactName: build-artifacts-$(Build.BuildId)
            steps:
              - checkout: self
                persistCredentials: false

              - task: NodeTool@0
                displayName: Use Node.js $(NodeVersion)
                inputs:
                  versionSpec: $(NodeVersion)

              - script: npm ci
                displayName: Install dependencies

              - script: npm run build
                displayName: Build project

              - script: |
                  set -euo pipefail
                  VERSION=$(jq -r '.version' package.json)
                  echo "Resolved version: $VERSION"
                  echo "##vso[task.setvariable variable=PackageVersion;isOutput=true]$VERSION"
                name: package_version
                displayName: Resolve package version

              - task: CopyFiles@2
                displayName: Stage build outputs for publish stage
                inputs:
                  sourceFolder: $(Build.SourcesDirectory)
                  contents: |
                    package.json
                    package-lock.json
                    README.md
                    LICENSE
                    CHANGELOG.md
                    dist/**
                    dist-cjs/**
                    skills/**/SKILL.md
                    policies/**/*.rego
                    policies/compiled/*.wasm
                    policies.user.examples/**/*.rego
                    policies.user.examples/**/*.md
                    knowledge/packs/**/*.json
                    scripts/prepare-cjs-package.cjs
                    scripts/restore-package.cjs
                  targetFolder: $(Build.ArtifactStagingDirectory)/build-output

      - stage: Publish
        displayName: Publish Partner Drop
        dependsOn: Build
        condition: succeeded()
        variables:
          PackageVersion: $[ stageDependencies.Build.Build.outputs['package_version.PackageVersion'] ]
        jobs:
          - job: Publish
            displayName: Publish Partner Drop
            templateContext:
              outputs:
                - output: pipelineArtifact
                  displayName: Publish tarball as pipeline artifact
                  targetPath: $(Build.ArtifactStagingDirectory)/partner-drop
                  artifactName: partner-drop-$(PackageVersion)
            steps:
              - checkout: none

              - download: current
                artifact: build-artifacts-$(Build.BuildId)
                displayName: Download build artifacts

              - task: NodeTool@0
                displayName: Use Node.js $(NodeVersion)
                inputs:
                  versionSpec: $(NodeVersion)

              - script: |
                  set -euo pipefail
                  ARTIFACT_DIR="$(Pipeline.Workspace)/build-artifacts-$(Build.BuildId)"
                  echo "##vso[task.setvariable variable=WorkDir]$ARTIFACT_DIR"
                  ls -la "$ARTIFACT_DIR"
                displayName: Locate downloaded artifacts

              - script: |
                  set -euo pipefail
                  VERSION="$(PackageVersion)"
                  CHANGELOG="$(WorkDir)/CHANGELOG.md"
                  if [ ! -f "$CHANGELOG" ]; then
                    echo "##vso[task.logissue type=error]CHANGELOG.md not found at $CHANGELOG"
                    exit 1
                  fi
                  # Extract the section for this version: from the matching
                  # heading until the next "## " heading.
                  NOTES=$(awk -v ver="$VERSION" '
                    BEGIN {
                      esc=ver
                      gsub(/[][(){}.^$*+?|\\]/, "\\\\&", esc)
                    }
                    $0 ~ ("^## \\[?" esc "\\]?([[:space:]]*-.*)?$") {flag=1; next}
                    /^## / {flag=0}
                    flag {print}
                  ' "$CHANGELOG")
                  if [ -z "$(echo "$NOTES" | tr -d '[:space:]')" ]; then
                    echo "##vso[task.logissue type=error]No CHANGELOG.md entry found for version $VERSION"
                    exit 1
                  fi
                  NOTES_FILE="$(Build.ArtifactStagingDirectory)/release-notes.md"
                  {
                    echo "Publish $VERSION"
                    echo
                    echo "$NOTES"
                  } > "$NOTES_FILE"
                  echo "##vso[task.setvariable variable=ReleaseNotesFile]$NOTES_FILE"
                  echo "Release notes written to $NOTES_FILE"
                displayName: Validate CHANGELOG and extract notes

              - script: |
                  set -euo pipefail
                  cd "$(WorkDir)"
                  TARBALL=$(npm pack | tail -n 1)
                  if [ ! -f "$TARBALL" ]; then
                    echo "##vso[task.logissue type=error]Expected tarball not found: $TARBALL"
                    exit 1
                  fi
                  echo "##vso[task.setvariable variable=TarballName]$TARBALL"
                  echo "##vso[task.setvariable variable=TarballPath]$(WorkDir)/$TARBALL"
                  ls -la "$TARBALL"
                displayName: Create package tarball

              - task: CopyFiles@2
                displayName: Stage tarball for 1ES artifact output
                inputs:
                  sourceFolder: "$(WorkDir)"
                  contents: "$(TarballName)"
                  targetFolder: "$(Build.ArtifactStagingDirectory)/partner-drop"

              - task: GitHubRelease@1
                displayName: Create GitHub release
                inputs:
                  gitHubConnection: $(GitHubServiceConnection)
                  repositoryName: $(Build.Repository.Name)
                  action: create
                  target: $(Build.SourceVersion)
                  tagSource: userGivenTag
                  tag: $(PackageVersion)
                  title: $(PackageVersion)
                  releaseNotesFilePath: $(ReleaseNotesFile)
                  isDraft: false
                  isPreRelease: false
                  addChangeLog: false

              - task: AzurePowerShell@5
                displayName: Upload tarball to partner drop storage
                inputs:
                  azureSubscription: "$(AzureServiceConnection)"
                  ScriptType: InlineScript
                  azurePowerShellVersion: LatestVersion
                  pwsh: true
                  Inline: |
                    $ErrorActionPreference = 'Stop'
                    $version  = "$(PackageVersion)"
                    $tarball  = "$(TarballPath)"
                    $blobPath = "drops/$(PackageName)/$(Language)/$version"
                    $dest     = "https://$(StorageAccountName).blob.core.windows.net/$blobPath/"
                    Write-Host "Uploading $tarball to $dest"
                    azcopy copy "$tarball" "$dest"
                env:
                  AZCOPY_AUTO_LOGIN_TYPE: PSCRED
