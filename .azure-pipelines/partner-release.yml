# Partner Release pipeline
trigger: none
pr: none

resources:
  repositories:
    - repository: 1esPipelines
      type: git
      name: 1ESPipelineTemplates/1ESPipelineTemplates
      ref: refs/tags/release

variables:
  StorageAccountName: azuresdkpartnerdrops
  AzureServiceConnection: azuresdkpartnerdrops
  GitHubServiceConnection: github-containerization-assist
  # Folder name under `drops/` in partner drop storage (not the npm package name).
  PartnerDropFolder: containerization-assist
  Language: js
  NodeVersion: "22.x"

extends:
  template: v1/1ES.Official.PipelineTemplate.yml@1esPipelines
  parameters:
    pool:
      name: production-pool-amd64-mariner-2
      image: 1es-azlinux-3-amd64-custom-disk
      os: linux
      hostArchitecture: amd64
    sdl:
      sourceAnalysisPool:
        name: production-pool-amd64-mariner-2
        image: azcu-agent-amd64-windows-22-img
        os: windows
        hostArchitecture: amd64

    stages:
      - stage: Build
        displayName: Build Partner Drop
        jobs:
          - job: Build
            displayName: Build Partner Drop
            templateContext:
              outputs:
                - output: pipelineArtifact
                  displayName: Publish release artifacts
                  targetPath: $(Build.ArtifactStagingDirectory)/partner-drop
                  artifactName: partner-drop-$(Build.BuildId)
            steps:
              - checkout: self
                persistCredentials: false

              - task: NodeTool@0
                displayName: Use Node.js $(NodeVersion)
                inputs:
                  versionSpec: $(NodeVersion)

              # Route this build's install through the CFS proxy (1ES agents
              # block npmjs). Lockfile 'resolved' URLs are rewritten, then
              # restored so staged artifacts stay pristine.
              - script: |
                  set -euo pipefail
                  backup="package-lock.json.bak"
                  cp package-lock.json "$backup"
                  trap 'mv -f "$backup" package-lock.json' EXIT
                  sed -i 's#https://registry\.npmjs\.org/#https://packagefeedproxy.microsoft.io/npm/#g' package-lock.json
                  NPM_CONFIG_REGISTRY=https://packagefeedproxy.microsoft.io/npm/ NPM_CONFIG_ALWAYS_AUTH=true npm ci
                displayName: Install dependencies via CFS proxy (1ES agents block public registry)

              - script: npm run build
                displayName: Build project

              - script: |
                  set -euo pipefail
                  VERSION=$(node -p "require('./package.json').version")
                  IS_PRERELEASE=$(node -p "require('./package.json').version.split('+')[0].includes('-')")
                  echo "Resolved version: $VERSION"
                  echo "##vso[task.setvariable variable=PackageVersion;isOutput=true]$VERSION"
                  echo "##vso[task.setvariable variable=IsPrerelease;isOutput=true]$IS_PRERELEASE"
                name: package_version
                displayName: Resolve package version

              - script: |
                  set -euo pipefail
                  VERSION="$(package_version.PackageVersion)"
                  CHANGELOG="$(Build.SourcesDirectory)/CHANGELOG.md"
                  if [ ! -f "$CHANGELOG" ]; then
                    echo "##vso[task.logissue type=error]CHANGELOG.md not found at $CHANGELOG"
                    exit 1
                  fi
                  # Extract the section for this version: from the matching
                  # heading until the next "## " heading.
                  NOTES=$(awk -v ver="$VERSION" '
                    BEGIN {
                      esc=ver
                      gsub(/[][(){}.^$*+?|\\]/, "\\\\&", esc)
                    }
                    $0 ~ ("^## \\[?" esc "\\]?([[:space:]]*-.*)?$") {flag=1; next}
                    /^## / {flag=0}
                    flag {print}
                  ' "$CHANGELOG")
                  if [ -z "$(echo "$NOTES" | tr -d '[:space:]')" ]; then
                    echo "##vso[task.logissue type=error]No CHANGELOG.md entry found for version $VERSION"
                    exit 1
                  fi
                  mkdir -p "$(Build.ArtifactStagingDirectory)/partner-drop"
                  NOTES_FILE="$(Build.ArtifactStagingDirectory)/partner-drop/release-notes.md"
                  {
                    echo "Publish $VERSION"
                    echo
                    echo "$NOTES"
                  } > "$NOTES_FILE"
                  echo "Release notes written to $NOTES_FILE"
                displayName: Validate CHANGELOG and extract notes

              - script: |
                  set -euo pipefail
                  # Use `npm pack --json` and parse the filename out of the
                  # structured output. Parsing `npm pack` stdout is brittle
                  # because warnings/notices can be interleaved.
                  TARBALL=$(npm pack --json | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>process.stdout.write(JSON.parse(d)[0].filename))')
                  if [ ! -f "$TARBALL" ]; then
                    echo "##vso[task.logissue type=error]Expected tarball not found: $TARBALL"
                    exit 1
                  fi
                  echo "##vso[task.setvariable variable=TarballName;isOutput=true]$TARBALL"
                  ls -la "$TARBALL"
                name: package_tarball
                displayName: Create package tarball

              - task: CopyFiles@2
                displayName: Stage tarball for 1ES artifact output
                inputs:
                  sourceFolder: "$(Build.SourcesDirectory)"
                  contents: "$(package_tarball.TarballName)"
                  targetFolder: "$(Build.ArtifactStagingDirectory)/partner-drop"

      - stage: Publish
        displayName: Publish Partner Drop
        dependsOn: Build
        condition: succeeded()
        variables:
          PackageVersion: $[ stageDependencies.Build.Build.outputs['package_version.PackageVersion'] ]
          IsPrerelease: $[ stageDependencies.Build.Build.outputs['package_version.IsPrerelease'] ]
          TarballName: $[ stageDependencies.Build.Build.outputs['package_tarball.TarballName'] ]
        jobs:
          - job: Publish
            displayName: Publish Partner Drop
            templateContext:
              type: releaseJob
              isProduction: true
              inputs:
                - input: pipelineArtifact
                  artifactName: partner-drop-$(Build.BuildId)
                  targetPath: $(Pipeline.Workspace)/partner-drop
            steps:
              - checkout: none

              - task: AzureCLI@2
                displayName: Upload tarball to partner drop storage
                inputs:
                  azureSubscription: "$(AzureServiceConnection)"
                  scriptType: bash
                  scriptLocation: inlineScript
                  inlineScript: |
                    set -euo pipefail
                    az storage blob upload \
                      --account-name "$(StorageAccountName)" \
                      --container-name drops \
                      --name "$(PartnerDropFolder)/$(Language)/$(PackageVersion)/$(TarballName)" \
                      --file "$(Pipeline.Workspace)/partner-drop/$(TarballName)" \
                      --auth-mode login \
                      --overwrite false \
                      --only-show-errors

              - task: GitHubRelease@1
                displayName: Create GitHub release
                inputs:
                  gitHubConnection: $(GitHubServiceConnection)
                  repositoryName: $(Build.Repository.Name)
                  action: create
                  target: $(Build.SourceVersion)
                  tagSource: userGivenTag
                  tag: $(PackageVersion)
                  title: $(PackageVersion)
                  releaseNotesFilePath: $(Pipeline.Workspace)/partner-drop/release-notes.md
                  isDraft: false
                  isPreRelease: $(IsPrerelease)
                  addChangeLog: false
