name: Agent Eval Gradient

# Runs the agent-eval gradient sweep (bare | mcp | skills) against the live
# eval AKS cluster, then publishes the report two ways:
#   * the markdown heatmap is written to the run's Step Summary (renders inline)
#   * the self-contained HTML heatmap is uploaded as a downloadable artifact
#
# Required repository secrets:
#   AZURE_FOUNDRY_API_KEY   - Foundry/Azure OpenAI key the models authenticate with
#   AZURE_FOUNDRY_ENDPOINT  - e.g. https://<resource>.services.ai.azure.com/openai/v1
#   AZURE_CLIENT_ID         - app registration (federated credential) for OIDC login
#   AZURE_TENANT_ID         - tenant of the eval subscription
#   AZURE_SUBSCRIPTION_ID   - the "Cloud Native Tools" subscription holding ca-test-suite
#
# The OIDC identity needs, on resource group ca-test-suite: rights to
# get AKS credentials (Azure Kubernetes Service Cluster User/Admin) and to
# enable the ACR admin user + push (e.g. Contributor on caevalacr). If the AKS
# cluster is AAD-only, add a kubelogin step; if local accounts are enabled the
# preflight's `az aks get-credentials` is sufficient.

on:
  workflow_dispatch:
    inputs:
      fixtures:
        description: Comma-separated fixture directories
        default: test/fixtures/legacy-java/spring-boot-rest-api,test/fixtures/legacy-java/spring-mvc-war,test/fixtures/legacy-java/wildfly-container-quickstart
      models:
        description: Comma-separated provider:model list
        default: azure:gpt-4o,azure:gpt-4.1,azure:gpt-4.1-mini
      reps:
        description: Repetitions per (model x fixture x path) cell
        default: '3'
      paths:
        description: "Subset of paths (blank = all: bare,mcp,skills)"
        default: ''

permissions:
  contents: read
  id-token: write # required for azure/login OIDC

concurrency:
  # Serialize sweeps: they share one cluster + namespace.
  group: agent-eval-gradient
  cancel-in-progress: false

env:
  NODE_VERSION: '22'

jobs:
  gradient:
    name: Gradient sweep
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Azure login (OIDC)
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Ensure kubectl
        run: kubectl version --client || az aks install-cli

      - name: Run gradient sweep
        env:
          AZURE_FOUNDRY_API_KEY: ${{ secrets.AZURE_FOUNDRY_API_KEY }}
          AZURE_FOUNDRY_ENDPOINT: ${{ secrets.AZURE_FOUNDRY_ENDPOINT }}
          # Eval infra targets (match the team-subscription layout).
          AGENT_EVAL_RESOURCE_GROUP: ca-test-suite
          AGENT_EVAL_CLUSTER: ca-eval-aks
          AGENT_EVAL_REGISTRY: caevalacr.azurecr.io
          AGENT_EVAL_NAMESPACE: eval-ns
        run: |
          PATHS_ARG=()
          if [ -n "${{ inputs.paths }}" ]; then PATHS_ARG=(--paths "${{ inputs.paths }}"); fi
          npm run eval -- gradient \
            --fixtures "${{ inputs.fixtures }}" \
            --models "${{ inputs.models }}" \
            --reps "${{ inputs.reps }}" \
            "${PATHS_ARG[@]}" \
            --out "$RUNNER_TEMP/gradient.json"

      - name: Publish heatmap to Step Summary
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/gradient.md" ]; then
            cat "$RUNNER_TEMP/gradient.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Gradient run produced no markdown report (the sweep likely failed before completion)." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: gradient-report
          path: |
            ${{ runner.temp }}/gradient.html
            ${{ runner.temp }}/gradient.md
            ${{ runner.temp }}/gradient.json
          if-no-files-found: warn
