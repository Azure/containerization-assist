name: Individual Tool Integration Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: "20"

jobs:
  # Test prepare-cluster + push-image tools with local registry
  test-local-registry:
    name: Local Registry & Push (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
      fail-fast: false
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Setup Docker (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install docker

      - name: Setup kubectl & kind
        run: |
          if [ "$RUNNER_OS" == "macOS" ]; then
            brew install kubectl kind
          else
            curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
            chmod +x kubectl
            sudo mv kubectl /usr/local/bin/

            curl -Lo ./kind https://kind.sigs.k8s.io/dl/v0.20.0/kind-linux-amd64
            chmod +x ./kind
            sudo mv ./kind /usr/local/bin/
          fi

          kubectl version --client
          kind version

      - name: Run local registry integration test
        run: tsx scripts/integration-test-local-registry.ts
        timeout-minutes: 10

      - name: Show pod status on failure
        if: failure()
        run: |
          echo "=== Pods ==="
          kubectl get pods -A || true
          echo ""
          echo "=== Pod description ==="
          kubectl describe pod test-registry-pod || true
          echo ""
          echo "=== Pod events ==="
          kubectl get events --sort-by=.lastTimestamp || true

      - name: Cleanup
        if: always()
        run: |
          kubectl delete pod test-registry-pod --ignore-not-found=true || true
          kind delete cluster --name containerization-assist || true
          docker rm -f ca-registry || true

      - name: Show logs on failure
        if: failure()
        run: |
          echo "=== Docker containers ==="
          docker ps -a || true
          echo ""
          echo "=== Registry logs ==="
          docker logs ca-registry || true
          echo ""
          echo "=== Kind clusters ==="
          kind get clusters || true
          echo ""
          echo "=== kubectl version ==="
          kubectl version || true

      - name: Generate test summary
        if: always()
        run: |
          echo "# 🧪 Individual Tool Integration Tests" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Local Registry & Push Test" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Platform:** ${{ matrix.os }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Tools Tested" >> $GITHUB_STEP_SUMMARY
          echo "- \`prepare-cluster\` - Creates kind cluster with local registry" >> $GITHUB_STEP_SUMMARY
          echo "- \`push-image\` - Pushes image to local registry" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Test Flow" >> $GITHUB_STEP_SUMMARY
          echo "1. ✅ Create kind cluster with local registry" >> $GITHUB_STEP_SUMMARY
          echo "2. ✅ Verify registry is healthy and reachable from cluster" >> $GITHUB_STEP_SUMMARY
          echo "3. ✅ Build test image (busybox)" >> $GITHUB_STEP_SUMMARY
          echo "4. ✅ Push image to local registry" >> $GITHUB_STEP_SUMMARY
          echo "5. ✅ Verify image in registry catalog" >> $GITHUB_STEP_SUMMARY
          echo "6. ✅ Deploy pod using \`localhost:PORT/image\` format" >> $GITHUB_STEP_SUMMARY
          echo "7. ✅ Verify pod pulls image successfully" >> $GITHUB_STEP_SUMMARY
          echo "8. ✅ Verify pod executes successfully" >> $GITHUB_STEP_SUMMARY
