name: Refresh Action Pins

# Periodically refresh the generator's ACTION_PINS to the latest commit SHA within each
# action's current major, and open a PR for review. Complements scripts/refresh-action-pins.ts.
on:
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    name: Refresh generator action pins
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Refresh action pins
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run refresh:action-pins

      # A PR opened with the built-in GITHUB_TOKEN does NOT trigger the `pull_request`
      # workflows (test-pipeline.yml), so validate the refreshed pins here, before pushing.
      # (Alternative: push/open the PR with a GitHub App token or PAT so normal PR CI runs.)
      - name: Build and test refreshed pins
        run: |
          npm run build
          npm run test:unit

      - name: Open PR if pins changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PIN_FILE="src/tools/shared/action-pins.ts"
          if git diff --quiet -- "$PIN_FILE"; then
            echo "No pin changes — nothing to do."
            exit 0
          fi
          BRANCH="chore/refresh-action-pins-$(date +%Y%m%d%H%M)"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add "$PIN_FILE"
          git commit -m "chore: refresh generator action pins"
          git push -u origin "$BRANCH"
          gh pr create \
            --title "chore: refresh generator action pins" \
            --body "Automated refresh of \`ACTION_PINS\` to the latest commit SHA within each action's current major. **Review the SHAs before merging** (a human vouches for the pin). Generated by \`scripts/refresh-action-pins.ts\`."
