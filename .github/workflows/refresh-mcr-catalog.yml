name: Refresh MCR base-image catalog

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Refresh catalog from live MCR
        run: npx tsx scripts/refresh-mcr-catalog.ts

      - name: Open PR if the catalog changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if git diff --quiet -- knowledge/catalogs/mcr-base-images.json; then
            echo "No MCR catalog changes."
            exit 0
          fi
          branch="chore/refresh-mcr-catalog-$(date +%Y%m%d%H%M)"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add knowledge/catalogs/mcr-base-images.json
          git commit -m "chore: refresh MCR base-image catalog"
          git push -u origin "$branch"
          gh pr create --fill \
            --title "chore: refresh MCR base-image catalog" \
            --body "Automated refresh of \`knowledge/catalogs/mcr-base-images.json\` from the live MCR registry (\`/v2/<repo>/tags/list\`). Review the tag diff before merging."
