name: Test Pipeline

on:
  push:
    branches: [ main, develop, 'feat/**', 'fix/**' ]
  pull_request:
    branches: [ main, develop ]

env:
  NODE_VERSION: '22'

jobs:
  # Single test job with all essential validations
  test:
    name: Tests & Quality Gates (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Restore build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            dist
            dist-cjs
            .tsbuildinfo
            node_modules/.cache
          key: build-${{ runner.os }}-${{ hashFiles('src/**/*.ts', 'tsconfig*.json', 'package-lock.json') }}
          restore-keys: |
            build-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Install OPA CLI
        if: runner.os == 'Linux'
        run: |
          curl -L -o opa https://openpolicyagent.org/downloads/latest/opa_linux_amd64_static
          chmod +x opa
          mkdir -p node_modules/.bin
          mv opa node_modules/.bin/opa
          node_modules/.bin/opa version

      - name: Validate version sync
        if: runner.os == 'Linux'
        run: npx tsx scripts/validate-version-sync.ts

      - name: Build project
        run: npm run build

      - name: Verify build artifacts (cross-platform)
        run: >-
          node -e "['dist/src/index.js','dist/src/index.d.ts','dist/src/cli/cli.js','dist-cjs/src/index.js','dist-cjs/src/index.d.ts','dist-cjs/package.json'].forEach(function(f){if(!require('fs').existsSync(f)){console.error('Missing: '+f);process.exit(1)}});console.log('Build artifacts verified')"

      - name: Verify CLI is executable (POSIX)
        if: runner.os != 'Windows'
        run: test -x dist/src/cli/cli.js || { echo "CLI entrypoint is not executable"; exit 1; }

      - name: Test OPA Policies
        if: runner.os == 'Linux'
        run: |
          echo "Testing built-in policies..."
          npm run test:policies 2>&1 | tee policy-tests-builtin.txt

          echo "Testing example policies (including generation-config)..."
          npm run test:policies -- policies.user.examples/ 2>&1 | tee policy-tests-examples.txt

          # Extract test counts
          BUILTIN_COUNT=$(grep -oP '\d+(?=/\d+ PASS)' policy-tests-builtin.txt | tail -1 || echo "0")
          EXAMPLES_COUNT=$(grep -oP '\d+(?=/\d+ PASS)' policy-tests-examples.txt | tail -1 || echo "0")
          TOTAL_POLICY_TESTS=$((BUILTIN_COUNT + EXAMPLES_COUNT))

          echo "POLICY_TESTS_PASSED=${TOTAL_POLICY_TESTS}" >> $GITHUB_ENV
          echo "✅ All ${TOTAL_POLICY_TESTS} OPA policy tests passed"

      - name: Validate examples compile
        if: runner.os == 'Linux'
        run: node scripts/validate-examples.js

      - name: Check formatting
        run: npm run format:check

      - name: Run lint and cache output
        if: runner.os == 'Linux'
        run: npm run lint 2>&1 | tee eslint-output.txt || true

      - name: Run tests with coverage
        if: runner.os == 'Linux'
        run: npm run test:coverage -- --passWithNoTests
        env:
          DOCKER_AVAILABLE: true

      - name: Extract coverage metrics
        if: runner.os == 'Linux'
        continue-on-error: true
        run: |
          if [ -f "coverage/coverage-summary.json" ]; then
            OVERALL=$(jq -r '.total.statements.pct // "N/A"' coverage/coverage-summary.json)
            BRANCHES=$(jq -r '.total.branches.pct // "N/A"' coverage/coverage-summary.json)
            echo "✅ Coverage: ${OVERALL}% statements, ${BRANCHES}% branches"

            # Save for summary
            echo "COVERAGE_OVERALL=${OVERALL}" >> $GITHUB_ENV
            echo "COVERAGE_BRANCHES=${BRANCHES}" >> $GITHUB_ENV
          else
            echo "⚠️ Coverage data not available"
            echo "COVERAGE_OVERALL=N/A" >> $GITHUB_ENV
            echo "COVERAGE_BRANCHES=N/A" >> $GITHUB_ENV
          fi

      - name: Verify ESM import extensions
        if: runner.os == 'Linux'
        run: |
          if grep -r "from ['\"]\.\.\/[^'\"]*['\"]" dist/src --include="*.js" | grep -v "\.js['\"]"; then
            echo "❌ Found ESM imports without .js extensions"
            exit 1
          fi
          echo "✅ ESM import extensions verified"

      - name: Run quality gates
        if: runner.os == 'Linux'
        run: |
          UPDATE_BASELINES=true npm run quality:gates 2>&1 | tee quality-gates.txt || true

          # Save gate status for summary
          if grep -q "✅" quality-gates.txt; then
            echo "QUALITY_STATUS=✅ Passed" >> $GITHUB_ENV
          elif grep -q "⚠️" quality-gates.txt; then
            echo "QUALITY_STATUS=⚠️ Warning" >> $GITHUB_ENV
          else
            echo "QUALITY_STATUS=❌ Failed" >> $GITHUB_ENV
          fi

      - name: Generate workflow summary
        if: always() && runner.os == 'Linux'
        run: |
          echo "# 🛡️ Test Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 📊 Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Quality Gates** | ${QUALITY_STATUS:-⚠️ Unknown} |" >> $GITHUB_STEP_SUMMARY
          echo "| **OPA Policy Tests** | ✅ ${POLICY_TESTS_PASSED:-0} passed |" >> $GITHUB_STEP_SUMMARY
          echo "| **Coverage (Statements)** | ${COVERAGE_OVERALL:-N/A}% |" >> $GITHUB_STEP_SUMMARY
          echo "| **Coverage (Branches)** | ${COVERAGE_BRANCHES:-N/A}% |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -f "quality-gates.txt" ]; then
            echo "## 📋 Quality Gates Report" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            cat quality-gates.txt >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi

          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "📦 **Artifacts:** Download \`quality-gates.txt\` for full quality report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📊 **Coverage:** Download \`coverage/\` for detailed HTML report" >> $GITHUB_STEP_SUMMARY

      # Upload all artifacts in single step
      - name: Upload artifacts
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: build-and-quality-${{ github.run_id }}
          path: |
            dist/
            dist-cjs/
            quality-gates.txt
            eslint-output.txt
            policy-tests-builtin.txt
            policy-tests-examples.txt
            coverage/
          retention-days: 7

  # Optional security scan (reuses build from test job)
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-and-quality-${{ github.run_id }}
          path: .

      - name: Install dependencies (for audit)
        run: npm ci

      - name: Dependency audit
        run: npm audit --audit-level moderate || true

      - name: CodeQL Analysis
        uses: github/codeql-action/init@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          languages: typescript
          queries: security-and-quality
          config-file: ./.github/workflows/codeql/codeql-config.yml

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
