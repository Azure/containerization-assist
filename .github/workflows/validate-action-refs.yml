name: Validate Action Refs

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate GitHub Action SHAs & Tags
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v4
        with:
          node-version: '22'

      - name: Restore validated refs cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .validated-action-refs
          key: action-refs-${{ hashFiles('.github/workflows/**') }}
          restore-keys: |
            action-refs-

      - name: Install dependencies
        run: npm ci

      - name: Validate action references
        env:
          GH_TOKEN: ${{ github.token }}
        run: npx --no-install tsx scripts/validate-action-refs.ts
