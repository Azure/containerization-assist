trigger:
  branches:
    include:
      - main
  paths:
    include:
      - skills
      - azure-pipelines.yml

# Do not auto-run the gradient sweep on pull requests — it is too slow to gate
# PRs on (a single rep still takes a while). Trigger it manually instead from the
# Azure DevOps UI (Run pipeline → choose the source branch). Merges to main still
# run automatically via the `trigger` block above.
pr: none

parameters:
  - name: fixtures
    type: string
    default: test/fixtures/legacy-java/spring-boot-rest-api,test/fixtures/legacy-java/spring-mvc-war,test/fixtures/legacy-java/ejb-ant-monolith,test/fixtures/legacy-java/wildfly-container-quickstart
  - name: models
    type: string
    default: azure:gpt-4o,azure:gpt-4.1,azure:gpt-5.4
  - name: reps
    type: string
    default: '1'
  - name: paths
    type: string
    default: ''
  - name: timeoutInMinutes
    type: number
    default: 360

variables:
  - group: agent-eval-foundry
  - name: azureServiceConnection
    value: ca-agent-eval-svc-conn
  - name: NODE_VERSION
    value: '22'

pool:
  name: azcu-test-staging-pool-amd64

jobs:
  - job: gradient
    displayName: Gradient sweep
    timeoutInMinutes: ${{ parameters.timeoutInMinutes }}
    steps:
      - checkout: self
        fetchDepth: 0

      - task: NodeTool@0
        displayName: Setup Node.js
        inputs:
          versionSpec: $(NODE_VERSION)

      - script: |
          set -euo pipefail
          missing=()
          [ -z "${AZURE_FOUNDRY_API_KEY:-}"  ] && missing+=(AZURE_FOUNDRY_API_KEY)
          [ -z "${AZURE_FOUNDRY_ENDPOINT:-}" ] && missing+=(AZURE_FOUNDRY_ENDPOINT)
          if [ ${#missing[@]} -gt 0 ]; then
            echo "##vso[task.logissue type=error]Missing required variables: ${missing[*]} (add them to the 'agent-eval-foundry' variable group)"
            exit 1
          fi
        displayName: Preflight - verify Foundry variables
        env:
          AZURE_FOUNDRY_API_KEY: $(AZURE_FOUNDRY_API_KEY)
          AZURE_FOUNDRY_ENDPOINT: $(AZURE_FOUNDRY_ENDPOINT)

      - script: npm ci
        displayName: Install dependencies

      - script: npm run build
        displayName: Build project

      - task: AzureCLI@2
        displayName: Run gradient sweep
        inputs:
          azureSubscription: $(azureServiceConnection)
          scriptType: bash
          scriptLocation: inlineScript
          inlineScript: |
            set -euo pipefail
            kubectl version --client >/dev/null 2>&1 || az aks install-cli

            case "${BUILD_REASON:-}" in
              IndividualCI|BatchedCI) REPS="3" ;;
            esac

            PATHS_ARG=()
            if [ -n "${PATHS_INPUT:-}" ]; then PATHS_ARG=(--paths "$PATHS_INPUT"); fi

            npm run eval -- gradient \
              --fixtures "$FIXTURES" \
              --models "$MODELS" \
              --reps "$REPS" \
              "${PATHS_ARG[@]}" \
              --out "$(Build.ArtifactStagingDirectory)/gradient.json"
        env:
          AZURE_FOUNDRY_API_KEY: $(AZURE_FOUNDRY_API_KEY)
          AZURE_FOUNDRY_ENDPOINT: $(AZURE_FOUNDRY_ENDPOINT)
          AGENT_EVAL_RESOURCE_GROUP: ca-test-suite
          AGENT_EVAL_CLUSTER: ca-eval-aks
          AGENT_EVAL_REGISTRY: caevalacr.azurecr.io
          AGENT_EVAL_NAMESPACE: eval-ns
          AGENT_EVAL_ACR_ADMIN: '1'
          BUILD_REASON: $(Build.Reason)
          FIXTURES: ${{ parameters.fixtures }}
          MODELS: ${{ parameters.models }}
          REPS: ${{ parameters.reps }}
          PATHS_INPUT: ${{ parameters.paths }}

      - publish: $(Build.ArtifactStagingDirectory)
        artifact: gradient-report
        displayName: Publish report artifact
        condition: always()
