apiVersion: policy.containerization-assist.dev/v1
kind: PolicySet
metadata:
  name: complex-perf
spec:
  rules:
    - name: rule1
      category: security
      severity: block
      condition: '!input.content.contains("USER")'
      message: "Rule 1"
    - name: rule2
      category: security
      severity: block
      condition: '!input.content.contains("HEALTHCHECK")'
      message: "Rule 2"
    - name: rule3
      category: optimization
      severity: warn
      condition: '!input.content.contains("AS builder")'
      message: "Rule 3"
    - name: rule4
      category: security
      severity: block
      condition: 'input.content.contains(":latest")'
      message: "Rule 4"
    - name: rule5
      category: best-practices
      severity: suggest
      condition: '!input.content.contains("EXPOSE")'
      message: "Rule 5"
    - name: rule6
      category: security
      severity: warn
      condition: '!input.content.contains("WORKDIR")'
      message: "Rule 6"
    - name: rule7
      category: optimization
      severity: suggest
      condition: '!input.content.contains("COPY")'
      message: "Rule 7"
    - name: rule8
      category: security
      severity: block
      condition: 'input.content.contains("root")'
      message: "Rule 8"
    - name: rule9
      category: best-practices
      severity: warn
      condition: '!input.content.contains("ENV")'
      message: "Rule 9"
    - name: rule10
      category: optimization
      severity: suggest
      condition: '!input.content.contains("RUN apt-get")'
      message: "Rule 10"
